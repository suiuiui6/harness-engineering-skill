<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Harness Engineering layer flow</title>
  <desc id="desc">Seven layers advance only with evidence. Maintenance mode re-enters the smallest invalid layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Harness Engineering</text>
  <text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">Each layer gates the next. No pass evidence, no advance.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="110" width="560" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="58" y="139" font-size="15" font-weight="600" fill="#111827">Layer 0</text>
    <text x="140" y="139" font-size="14" fill="#374151">Capability boundary and non-goals</text>

    <rect x="40" y="177" width="560" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="58" y="206" font-size="15" font-weight="600" fill="#111827">Layer 1</text>
    <text x="140" y="206" font-size="14" fill="#374151">Per-component MVP on real input</text>

    <rect x="40" y="244" width="560" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="58" y="273" font-size="15" font-weight="600" fill="#111827">Layer 2</text>
    <text x="140" y="273" font-size="14" fill="#374151">Integration topology and replayable bridge</text>

    <rect x="40" y="311" width="560" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="58" y="340" font-size="15" font-weight="600" fill="#111827">Layer 3</text>
    <text x="140" y="340" font-size="14" fill="#374151">Technical architecture decisions</text>

    <rect x="40" y="378" width="560" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="58" y="407" font-size="15" font-weight="600" fill="#111827">Layer 4</text>
    <text x="140" y="407" font-size="14" fill="#374151">PRD, backend API, frontend spec</text>

    <rect x="40" y="445" width="560" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="58" y="474" font-size="15" font-weight="600" fill="#111827">Layer 5</text>
    <text x="140" y="474" font-size="14" fill="#374151">Engineering rules and product contract</text>

    <rect x="40" y="512" width="560" height="46" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="58" y="541" font-size="15" font-weight="600" fill="#111827">Layer 6</text>
    <text x="140" y="541" font-size="14" fill="#374151">Tests, security, observability, readiness</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)">
    <line x1="320" y1="156" x2="320" y2="175"/>
    <line x1="320" y1="223" x2="320" y2="242"/>
    <line x1="320" y1="290" x2="320" y2="309"/>
    <line x1="320" y1="357" x2="320" y2="376"/>
    <line x1="320" y1="424" x2="320" y2="443"/>
    <line x1="320" y1="491" x2="320" y2="510"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="660" y="110" width="300" height="142" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="680" y="139" font-size="15" font-weight="600" fill="#111827">Gate evidence</text>
    <text x="680" y="164" font-size="13" fill="#374151">pass / fail / not-run</text>
    <text x="680" y="186" font-size="13" fill="#374151">command, exit code, inputs</text>
    <text x="680" y="208" font-size="13" fill="#374151">stale evidence is not evidence</text>
    <text x="680" y="230" font-size="13" fill="#374151">mocks do not prove integration</text>

    <rect x="660" y="278" width="300" height="156" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="680" y="307" font-size="15" font-weight="600" fill="#111827">Maintenance re-entry</text>
    <text x="680" y="332" font-size="13" fill="#374151">local bug: stay at Layer 6</text>
    <text x="680" y="354" font-size="13" fill="#374151">new module: Layer 4</text>
    <text x="680" y="376" font-size="13" fill="#374151">topology change: Layer 2</text>
    <text x="680" y="398" font-size="13" fill="#374151">new component: Layer 0</text>
    <text x="680" y="420" font-size="13" fill="#374151">reopen only the broken assumption</text>

    <rect x="660" y="460" width="300" height="98" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="680" y="489" font-size="15" font-weight="600" fill="#111827">Rollback rule</text>
    <text x="680" y="514" font-size="13" fill="#374151">downstream failure returns to the</text>
    <text x="680" y="536" font-size="13" fill="#374151">smallest layer whose evidence broke</text>
  </g>

  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-red)">
    <path d="M 660 490 L 620 490 L 620 356 L 604 356"/>
  </g>
  <text x="40" y="604" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Reference: core/flow.md, core/layer-details.md, core/checklists.md</text>
</svg>
